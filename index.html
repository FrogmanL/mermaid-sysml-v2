<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mermaid-sysml-v2 demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #fafafa;
      }
      h1 {
        font-size: 1.1rem;
      }
      textarea {
        width: 100%;
        height: 360px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        box-sizing: border-box;
      }
      #diagram {
        background: white;
        border: 1px solid #ddd;
        padding: 1rem;
        overflow: auto;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>mermaid-sysml-v2 — local demo (edit the source, diagram re-renders)</h1>
    <p>
      Example:
      <select id="example">
        <optgroup label="Real-world examples">
          <option value="vehicle.mmd">vehicle.mmd (part/port/interface defs)</option>
          <option value="bvm.mmd">bvm.mmd (containment + connectors)</option>
        </optgroup>
        <optgroup label="Feature showcase">
          <option value="features/01-part-port-interface-defs.mmd">01: part/port/interface defs</option>
          <option value="features/02-definition-vs-usage.mmd">02: definition vs. usage (corners/stereotype)</option>
          <option value="features/03-composition-tree.mmd">03: composition tree (recursive)</option>
          <option value="features/04-ibd-connectors.mmd">04: IBD connectors (arrows/labels/dedup)</option>
          <option value="features/05-nested-packages.mmd">05: nested packages</option>
          <option value="features/06-resilience.mmd">06: skips unsupported constructs</option>
          <option value="features/07-connector-forms.mmd">07: connector forms (::>, n-ary, connection)</option>
        </optgroup>
      </select>
    </p>
    <div class="cols">
      <textarea id="source" spellcheck="false"></textarea>
      <div id="diagram"></div>
    </div>

    <script type="module">
      import mermaid from 'mermaid';
      import sysmlV2Diagram from '/src/detector.ts';

      mermaid.registerExternalDiagrams([sysmlV2Diagram]);
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

      const textarea = document.getElementById('source');
      const target = document.getElementById('diagram');
      const exampleSelect = document.getElementById('example');

      let renderId = 0;
      async function render() {
        const id = `sysml-v2-render-${renderId++}`;
        target.innerHTML = '';
        try {
          const { svg } = await mermaid.render(id, textarea.value);
          target.innerHTML = svg;
        } catch (err) {
          target.innerHTML = `<pre style="color:#b00">${String(err.message ?? err)}</pre>`;
        }
      }

      async function loadExample(name) {
        try {
          const res = await fetch(`/examples/${name}`);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText} fetching ${name}`);
          textarea.value = await res.text();
          render();
        } catch (err) {
          target.innerHTML = `<pre style="color:#b00">Failed to load ${name}: ${String(err.message ?? err)}</pre>`;
        }
      }

      exampleSelect.addEventListener('change', () => loadExample(exampleSelect.value));
      textarea.addEventListener('input', () => {
        clearTimeout(window.__renderTimer);
        window.__renderTimer = setTimeout(render, 300);
      });

      await loadExample(exampleSelect.value);
    </script>
  </body>
</html>
