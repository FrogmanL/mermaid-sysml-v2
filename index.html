<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mermaid-sysml-v2 demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #fafafa;
      }
      h1 {
        font-size: 1.1rem;
      }
      textarea {
        width: 100%;
        height: 360px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        box-sizing: border-box;
      }
      #diagram {
        background: white;
        border: 1px solid #ddd;
        padding: 1rem;
        overflow: auto;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>mermaid-sysml-v2 — local demo (edit the source, diagram re-renders)</h1>
    <div class="cols">
      <textarea id="source" spellcheck="false"></textarea>
      <div id="diagram"></div>
    </div>

    <script type="module">
      import mermaid from 'mermaid';
      import sysmlV2Diagram from '/src/detector.ts';

      mermaid.registerExternalDiagrams([sysmlV2Diagram]);
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

      const textarea = document.getElementById('source');
      const target = document.getElementById('diagram');

      const initialSource = await fetch('/examples/vehicle.mmd').then((r) => r.text());
      textarea.value = initialSource;

      let renderId = 0;
      async function render() {
        const id = `sysml-v2-render-${renderId++}`;
        target.innerHTML = '';
        try {
          const { svg } = await mermaid.render(id, textarea.value);
          target.innerHTML = svg;
        } catch (err) {
          target.innerHTML = `<pre style="color:#b00">${String(err.message ?? err)}</pre>`;
        }
      }

      textarea.addEventListener('input', () => {
        clearTimeout(window.__renderTimer);
        window.__renderTimer = setTimeout(render, 300);
      });

      render();
    </script>
  </body>
</html>
