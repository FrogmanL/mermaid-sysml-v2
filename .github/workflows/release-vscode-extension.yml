name: Release VS Code extension

# Push a tag like `vscode-sysml-v2-v0.1.0` (matching packages/vscode-sysml-v2's
# package.json version) to build the VSIX and attach it to a GitHub Release.
on:
  push:
    tags: ['vscode-sysml-v2-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./packages/vscode-sysml-v2/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "vscode-sysml-v2-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Type-check and test
        run: |
          npm run typecheck -w vscode-sysml-v2
          npm test -w vscode-sysml-v2

      - name: Package VSIX
        run: npm run package -w vscode-sysml-v2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/vscode-sysml-v2/*.vsix \
            --title "SysML v2 Preview ${GITHUB_REF_NAME#vscode-sysml-v2-v}" \
            --generate-notes
